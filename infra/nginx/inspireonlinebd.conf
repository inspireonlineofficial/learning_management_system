# Nginx vhost for Inspire LMS — inspireonlinebd.com (behind Cloudflare proxy)
# Installed by .github/workflows/deploy.yml via /usr/local/sbin/inspire-apply-nginx.
# TLS: Cloudflare Origin Certificate (SSL/TLS mode "Full (strict)").

# Restore the real visitor IP from Cloudflare so per-IP rate limits work.
# Ranges: https://www.cloudflare.com/ips/
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

server {
    listen 80;
    listen [::]:80;
    server_name inspireonlinebd.com www.inspireonlinebd.com;
    return 301 https://inspireonlinebd.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name inspireonlinebd.com www.inspireonlinebd.com;

    ssl_certificate     /etc/ssl/cloudflare/inspireonlinebd.pem;
    ssl_certificate_key /etc/ssl/cloudflare/inspireonlinebd.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/inspire_access.log;
    error_log  /var/log/nginx/inspire_error.log;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Shared proxy headers. X-Real-IP is the Cloudflare-restored client IP.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto https;

    # Frontend (TanStack Start, port 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Go API (port 8080)
    location /v1/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        client_max_body_size 500M;
        proxy_read_timeout 300s;
    }

    # Google OAuth: public /auth/oauth/... -> backend /v1/auth/oauth/...
    # Must match the redirect URI registered in Google Cloud and GOOGLE_REDIRECT_URL.
    location /auth/oauth/ {
        proxy_pass http://127.0.0.1:8080/v1/auth/oauth/;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8080/health;
        access_log off;
    }
}
